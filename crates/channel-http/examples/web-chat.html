<!doctype html>
<!--
  A custom web chat window, complete, in about a hundred lines.

  Open it beside a running `ns-app serve` with `[http] listen` set, paste a
  token the company's back end minted, and talk. It is meant to be read and
  then thrown away: what is worth copying is the protocol, which is three
  JSON objects and a reconnect.

  The token is minted by your back end, never in the page: an HS256 JWT
  signed with that company's key, `iss` the tenant id, `sub` an opaque
  subject that is not an email address or a phone number, with `iat` and
  `exp`. In a real widget you would fetch it from your own session endpoint
  on load, and the visitor would never see it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfbfa; --fg: #1a1a19; --mine: #2f6f4f; --line: #dcdcd8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #e8e8e6; --mine: #79c0a0; --line: #2c2e33; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line);
           display: flex; gap: 10px; align-items: center; }
  header strong { font-weight: 600; }
  #state { margin-left: auto; font-size: 13px; opacity: .7; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex;
         flex-direction: column; gap: 10px; }
  .msg { max-width: min(72ch, 86%); padding: 8px 12px; border-radius: 12px;
         border: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; }
  .mine { align-self: flex-end; border-color: var(--mine); color: var(--mine); }
  .note { align-self: center; font-size: 13px; opacity: .6; border: none; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input, button { font: inherit; padding: 9px 12px; border-radius: 9px;
                  border: 1px solid var(--line); background: transparent; color: inherit; }
  #text { flex: 1; }
  button { cursor: pointer; }
</style>
</head>
<body>
  <header>
    <strong>Chat</strong>
    <input id="token" placeholder="paste a token" size="22" autocomplete="off">
    <button id="connect" type="button">connect</button>
    <span id="state">not connected</span>
  </header>
  <div id="log"></div>
  <form id="composer">
    <input id="text" placeholder="Say something" autocomplete="off" disabled>
    <button type="submit" disabled>send</button>
  </form>

<script>
// Where the shard is. Same origin by default; `wss:` when the page is https.
const ENDPOINT = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/chat";

const log = document.getElementById("log");
const state = document.getElementById("state");
const composer = document.getElementById("composer");
const text = document.getElementById("text");

let socket = null;
let token = "";
// Grows while the shard is unreachable, so a restart is not a hot loop.
let backoff = 500;

function say(what, kind) {
  const line = document.createElement("div");
  line.className = "msg " + kind;
  line.textContent = what;
  log.append(line);
  log.scrollTop = log.scrollHeight;
}

function ready(open) {
  text.disabled = !open;
  composer.querySelector("button").disabled = !open;
  state.textContent = open ? "connected" : "not connected";
}

function connect() {
  socket = new WebSocket(ENDPOINT);

  socket.onopen = () => {
    // The hello is the first frame. The session is the server's to decide:
    // it comes from the token, and naming one here would be ignored.
    socket.send(JSON.stringify({ token }));
    backoff = 500;
    ready(true);
  };

  socket.onmessage = (event) => {
    const reply = JSON.parse(event.data);
    say(reply.text, "theirs");
  };

  socket.onclose = (event) => {
    ready(false);
    // 4001 is "the hello was not accepted" — a token that is wrong, expired
    // or for another company. Reconnecting with it would fail identically,
    // so the page asks for a new one instead of retrying.
    if (event.code === 4001) {
      say("That token was not accepted. Paste a fresh one.", "note");
      return;
    }
    if (event.code === 1009) say("That message was too long.", "note");
    say("Disconnected — reconnecting.", "note");
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };

  // `onclose` always follows, and it is where the reconnect lives.
  socket.onerror = () => {};
}

document.getElementById("connect").onclick = () => {
  token = document.getElementById("token").value.trim();
  if (!token) return;
  if (socket) socket.close();
  connect();
};

composer.onsubmit = (event) => {
  event.preventDefault();
  const what = text.value.trim();
  if (!what || !socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({ text: what }));
  say(what, "mine");
  text.value = "";
};
</script>
</body>
</html>
