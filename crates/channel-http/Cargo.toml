[package]
name = "ns-channel-http"
version = "0.1.0"
edition = "2021"

[lib]
name = "nschannel_http"

[dependencies]
ns-core = { path = "../core" }
ns-channel-hub = { path = "../channel-hub" }
ns-identity = { path = "../identity" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
# The WebSocket handshake is defined in terms of SHA-1 and nothing else
# (RFC 6455 §4.2.2); it is a fingerprint of a nonce, not a security claim.
sha1 = "0.10"
sha2 = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ns-channel-tcp = { path = "../channel-tcp" }
