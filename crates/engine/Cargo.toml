[package]
name = "ns-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "nsengine"

[dependencies]
ns-core = { path = "../core" }
ns-provenance = { path = "../provenance" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }

# M8 Phase 3's tier rule is about what a *turn* dials, and the only store
# with a hybrid path is the sqlite one. A double with a hand-written
# `search_turns_hybrid` would be a test of the double.
[dev-dependencies]
ns-memory-sqlite = { path = "../memory-sqlite" }
tempfile = { workspace = true }
