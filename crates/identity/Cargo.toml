[package]
name = "ns-identity"
version = "0.1.0"
edition = "2021"

[lib]
name = "nsidentity"

[dependencies]
ns-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
# A resolver is named as `dyn IdentityResolver<A>` by each channel, and a
# native `async fn` in a trait is not dyn-compatible, so the future is boxed
# the way the rest of the workspace boxes its trait futures.
async-trait = { workspace = true }
thiserror = { workspace = true }
