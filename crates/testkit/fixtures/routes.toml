# Labelled route set (plan docs/plans/2026-11-26-classifier-router.md, JR-1).
#
# 100 customer messages, each with the class a person would give it. Everything here is invented: one
# made-up shop that sells refurbished electronics and tools and repairs them ("Arvel" and "Kovar" are
# made-up brands, "Vzorov" a made-up town, "DoDveří" and "Balíkobus" made-up carriers). No real person,
# company, address, e-mail or phone.
#
# Composition: 80 Czech and 20 English; 25 per class (20 Czech, 5 English); 20 follow a turn that the
# message cannot be read without (5 per class: 4 Czech, 1 English). Those carry `prev_user` and
# `prev_reply`, the turn before. Some Czech messages are typed without diacritics, as customers type.
#
# The set was written before any classifier was tried and before the keyword router was run on it, and
# is fixed from then on: a change goes into the plan's Log with the date.
#
# How a message was labelled, where two classes were possible:
# - a question the turn before already answers is `chat`, even when it is about opening hours or a price;
# - a question about the customer's own order (where it is, what state it is in) is `lookup`: it asks
#   for information and changes nothing;
# - "how do I return this?" is `lookup` (the policy); "return this for me" is `act`;
# - a message that points at something said earlier that the turn before does not hold is `recall`,
#   even in the middle of an order.
version = 1

# The default classes of the plan's section 2: the key, the tier it routes to, and the description
# the classifier is sent.
[[class]]
key = "chat"
tier = "chat"
description = "Greeting, thanks, small talk, or a question answered by this conversation alone"

[[class]]
key = "lookup"
tier = "task"
description = "Needs information about the company: products, prices, availability, people, opening hours, policies"

[[class]]
key = "recall"
tier = "deep"
description = "Refers to something said earlier that is not in the recent messages"

[[class]]
key = "act"
tier = "task"
description = "Asks for something to be done or changed: an order, a booking, a message, a desktop action"

