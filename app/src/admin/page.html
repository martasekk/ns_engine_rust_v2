<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ns-engine — settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #fff; --fg: #1a1a19; --dim: #6b6b66;
    --line: #e2e2dd; --accent: #2f6f4f; --bad: #a33; --ok: #2f6f4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --panel: #1c1e22; --fg: #e8e8e6; --dim: #9a9a94;
            --line: #2c2e33; --accent: #79c0a0; --bad: #e08a8a; --ok: #79c0a0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 0; max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .where { color: var(--dim); font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  nav { display: flex; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: none; border-bottom: 2px solid transparent;
               color: var(--dim); font: inherit; padding: 8px 12px; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 20px 24px 64px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 16px 18px; margin: 0 0 16px; }
  section h2 { font-size: 15px; margin: 0 0 4px; }
  section .note { color: var(--dim); font-size: 13px; margin: 0 0 14px; }
  .field { margin: 0 0 14px; }
  .field label { display: block; font-weight: 600; font-size: 13px; margin: 0 0 4px; }
  .field .help { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
  input[type=text], input[type=number], input[type=password], textarea, select {
    width: 100%; font: inherit; padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  textarea.tall { min-height: 180px; font-family: ui-monospace, Menlo, Consolas, monospace;
                  font-size: 13px; }
  label.check { font-weight: 400; margin: 0 0 4px; }
  label.check input { width: auto; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row input[type=checkbox] { width: auto; }
  button.do { background: var(--accent); color: #fff; border: none; border-radius: 7px;
              padding: 8px 16px; font: inherit; cursor: pointer; }
  button.quiet { background: none; border: 1px solid var(--line); color: inherit;
                 border-radius: 7px; padding: 7px 12px; font: inherit; cursor: pointer; }
  .bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
         padding: 12px 0; display: flex; gap: 12px; align-items: center; }
  .msg { font-size: 13px; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { font-size: 12px; color: var(--dim); font-weight: 600; }
  code, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); }
  .pill.set { color: var(--ok); border-color: var(--ok); }
  .pill.missing { color: var(--bad); border-color: var(--bad); }
  .help.sharing { color: var(--fg); border-left: 2px solid var(--bad); padding-left: 8px;
                  margin: 6px 0 0; }
  table.pick tbody tr { cursor: pointer; }
  table.pick tbody tr.chosen { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .chosen-name { font-size: 15px; margin: 22px 0 10px; color: var(--dim); }
  .banner { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
            border-radius: 8px; padding: 12px 14px; margin: 0 0 16px; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>ns-engine settings</h1>
  <div class="where" id="root"></div>
  <nav>
    <button data-tab="process" aria-selected="true">Process</button>
    <button data-tab="companies" aria-selected="false">Companies</button>
    <button data-tab="library" aria-selected="false">Library</button>
    <button data-tab="secrets" aria-selected="false">Vault</button>
  </nav>
</header>
<main id="main"></main>

<script>
// The token is in the fragment, which is never sent with a request. It is
// read once, then taken out of the address bar.
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("token") || "";
try { history.replaceState(null, "", location.pathname); } catch (e) {}

const main = document.getElementById("main");
let state = null;
let tab = "process";
let company = null;

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "authorization": "Bearer " + TOKEN, "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const answered = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(answered.error || ("the server answered " + res.status));
  // Some reads answer 200 with an error in the body — a config that will
  // not parse, say. Treated as an error here rather than rendered as an
  // empty page, which would look like "there is nothing configured" and
  // invite somebody to save over what is actually there.
  if (answered.error) throw new Error(answered.error);
  return answered;
}

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid !== null && kid !== undefined) node.append(kid.nodeType ? kid : String(kid));
  }
  return node;
}

// What the vault knows about one variable. The vault is the fuller list —
// it holds keys nothing references yet — and the form's own list is the
// fallback for the moment before it has loaded.
function vaultEntry(name) {
  return (state.vault || []).find((s) => s.name === name)
      || (state.secrets || []).find((s) => s.name === name)
      || null;
}

// The name a new key gets, minted from what it is for and whose it is:
// NS_LLM_API_KEY_ACME. Derived rather than typed, because a name invented
// on the spot is the one that gets misspelled on the second company.
function mintName(field, companyId) {
  const purpose = field.path.replace(/_envs?$/, "").replace(/[^A-Za-z0-9]+/g, "_").toUpperCase();
  return "NS_" + purpose + (companyId ? "_" + companyId.replace(/[^A-Za-z0-9]+/g, "_").toUpperCase() : "");
}

// A key field is a pick from the vault, not a name typed from memory. The
// list is every entry the vault holds — including ones nothing references
// yet — plus one option that mints a new name and asks for the value once.
function envNamePicker(field, value, companyId) {
  const NEW = "+new";
  const names = (state.vault || []).map((s) => s.name);
  if (value && !names.includes(value)) names.unshift(value);

  const select = el("select", { id: "f:" + field.path },
    el("option", { value: "" }, "(default: " + field.default + ")"),
    ...names.map((n) => el("option", { value: n }, n)),
    el("option", { value: NEW }, "new key…"));
  select.value = value ?? "";

  let previous = select.value;
  select.addEventListener("change", async () => {
    if (select.value !== NEW) { previous = select.value; return; }
    const name = window.prompt("Name for the new key", mintName(field, companyId));
    if (!name) { select.value = previous; return; }
    const secret = window.prompt("Its value. It is written to the vault now; Save puts the name in the config.");
    if (secret === null) { select.value = previous; return; }
    try {
      await api("/api/secret", { name: name.trim(), value: secret });
      select.append(el("option", { value: name.trim() }, name.trim()));
      select.value = name.trim();
      previous = select.value;
    } catch (e) { alert(e.message); select.value = previous; }
  });
  return select;
}

// One control, drawn for what the field says it is.
function control(field, value, companyId) {
  const id = "f:" + field.path;
  let input;
  if (field.kind === "envname") {
    input = envNamePicker(field, value, companyId);
  } else if (field.kind === "personaref") {
    const names = libraryOf("persona").map((e) => e.name);
    if (value && !names.includes(value)) names.unshift(value);
    input = el("select", { id },
      el("option", { value: "" }, "(default: " + field.default + ")"),
      ...names.map((n) => el("option", { value: n }, n)));
    input.value = value ?? "";
  } else if (field.kind === "modulerefs") {
    // Checkboxes rather than a list of names typed from memory: a module
    // that is not in the library is refused at the next start, and this is
    // where that mistake is cheapest to not make.
    const chosen = Array.isArray(value) ? value : [];
    const known = libraryOf("module").map((e) => e.name);
    for (const name of chosen) if (!known.includes(name)) known.push(name);
    input = el("div", { id },
      ...(known.length
        ? known.map((n) => {
            const box = el("input", { type: "checkbox", value: n });
            box.checked = chosen.includes(n);
            return el("label", { class: "row check" }, box, el("span", {}, n));
          })
        : [el("span", { class: "help" }, "the library has no modules yet")]));
  } else if (field.kind === "paragraph") {
    input = el("textarea", { id });
    input.value = value ?? "";
  } else if (field.kind === "list") {
    input = el("textarea", { id, placeholder: "one per line" });
    input.value = Array.isArray(value) ? value.join("\n") : (value ?? "");
  } else if (field.kind === "flag") {
    input = el("input", { type: "checkbox", id });
    input.checked = value === true;
  } else if (field.kind === "choice") {
    input = el("select", { id }, ...[""].concat(field.choices).map((c) =>
      el("option", { value: c }, c === "" ? "(default: " + field.default + ")" : c)));
    input.value = value ?? "";
  } else if (field.kind === "number") {
    input = el("input", { type: "number", id, placeholder: field.default });
    input.value = value ?? "";
  } else {
    input = el("input", { type: "text", id, placeholder: field.default });
    input.value = value ?? "";
  }
  input.dataset.path = field.path;
  input.dataset.kind = field.kind;

  // A field naming a variable says whether that variable has a value, since
  // naming one nobody exported is the likeliest mistake on this page.
  let status = null;
  if (field.kind === "envname" && value) {
    const known = vaultEntry(value);
    status = el("span", { class: "pill " + (known && known.set ? "set" : "missing") },
      known && known.set ? "value set" : "no value yet");
  }

  return el("div", { class: "field" },
    el("label", { for: id }, field.label, status ? " " : null, status),
    field.kind === "flag"
      ? el("div", { class: "row" }, input, el("span", { class: "help" }, field.help))
      : [input, field.help ? el("p", { class: "help" }, field.help) : null],
  );
}

function collect(scope) {
  const values = {};
  for (const input of scope.querySelectorAll("[data-path]")) {
    const kind = input.dataset.kind;
    if (kind === "modulerefs") {
      values[input.dataset.path] =
        [...input.querySelectorAll("input[type=checkbox]")].filter((b) => b.checked)
          .map((b) => b.value);
    }
    else if (kind === "flag") values[input.dataset.path] = input.checked;
    else if (kind === "list") values[input.dataset.path] = input.value;
    else if (kind === "number") values[input.dataset.path] = input.value.trim();
    else values[input.dataset.path] = input.value;
  }
  return values;
}

function settingsForm(sections, values, companyId) {
  const form = el("div", {});
  for (const section of sections) {
    form.append(el("section", {},
      el("h2", {}, section.title),
      section.note ? el("p", { class: "note" }, section.note) : null,
      ...section.fields.map((f) => control(f, values[f.path], companyId)),
    ));
  }
  const msg = el("span", { class: "msg" });
  form.append(el("div", { class: "bar" },
    el("button", { class: "do", onclick: async () => {
      msg.className = "msg"; msg.textContent = "Saving…";
      try {
        const out = await api("/api/settings", { company: companyId, values: collect(form) });
        msg.className = "msg ok";
        msg.textContent = "Saved to " + out.saved + " — restart ns-app for it to take effect.";
        await load();
      } catch (e) { msg.className = "msg bad"; msg.textContent = e.message; }
    } }, "Save"),
    msg,
  ));
  return form;
}

function processTab() {
  return el("div", {},
    el("div", { class: "banner" },
      "These are the process's own settings, shared by every company it hosts. " +
      "A key is never typed here: a field asks for the name of a variable, and " +
      "the Vault is where that variable gets its value."),
    settingsForm(state.process.sections, state.process.values, null));
}

function companiesTab() {
  const ids = state.companies;
  if (!company || !ids.includes(company)) company = ids[0] || null;

  const rows = (state.summaries || []).map((s) => el("tr", {
      class: s.id === company ? "chosen" : null,
      onclick: () => { company = s.id; render(); },
    },
    el("td", {}, el("div", { class: "mono" }, s.id),
      s.problem ? el("div", { class: "msg bad" }, s.problem) : null),
    el("td", {}, el("div", {}, s.model),
      s.own_model ? null : el("div", { class: "help" }, "the process's")),
    el("td", {}, s.reach.length
      ? s.reach.join(", ")
      : el("span", { class: "pill missing" }, "nothing reaches it yet")),
    el("td", {}, s.missing
      ? el("span", { class: "pill missing" },
          s.missing + (s.missing === 1 ? " key has no value" : " keys have no value"))
      : el("span", { class: "pill set" }, "ready")),
  ));

  const picker = el("section", {},
    el("h2", {}, "Companies"),
    el("p", { class: "note" },
      "One file each, in tenants/. A company is built on its first message — its own " +
      "database, persona, keys and budget — and nothing it can set here belongs to the " +
      "process. They all arrive on the one socket and the one endpoint: a company is " +
      "told apart by the credential it signs with, or by the account id inside a signed " +
      "delivery, never by an address of its own."),
    rows.length
      ? el("table", { class: "pick" }, el("thead", {}, el("tr", {},
          el("th", {}, "Company"), el("th", {}, "Model"),
          el("th", {}, "Reachable by"), el("th", {}, "Keys"))),
          el("tbody", {}, ...rows))
      : el("p", { class: "help" }, "None yet."),
    el("div", { class: "row", style: "margin-top:14px" },
      el("input", { type: "text", id: "newid", placeholder: "new company id, e.g. acme" }),
      el("button", { class: "quiet", onclick: async () => {
        const id = document.getElementById("newid").value.trim();
        if (!id) return;
        try { await api("/api/company", { id }); company = id; await load(); }
        catch (e) { alert(e.message); }
      } }, "Add"),
    ),
    el("p", { class: "help" },
      "An id cannot be changed afterwards: it is the first segment of every session id " +
      "the company has and the name of its store file, and neither of those would " +
      "follow. Choose it as you would a directory name."));

  if (!company) return el("div", {}, picker);
  return el("div", {}, picker,
    el("h2", { class: "chosen-name mono" }, company),
    settingsForm(state.company.sections, state.company.values[company] || {}, company),
    groupsSection(company));
}

// Where a variable is named, in a sentence. The company first, because on
// this page the question is nearly always "whose is this?".
function whereNamed(use) {
  return (use.company ? use.company + " · " : "the process · ") + use.path;
}

// What sharing one key actually costs, in words rather than a pill. The
// throttle is keyed on (base URL, key hash), so two companies on one key
// are one queue: the busy one paces the quiet one.
function sharingNote(entry) {
  const owners = (entry.process ? ["the process itself"] : []).concat(entry.companies);
  return el("p", { class: "help sharing" },
    owners.join(" and ") + " all use this key. They share the provider's quota and " +
    "one throttle, so the busier one paces the others. Give one its own variable if " +
    "that is not what you want.");
}

function vaultTab() {
  const entries = state.vault || [];
  const rows = entries.map((s) => {
    const input = el("input", { type: "password", placeholder: s.set ? "replace it" : "paste the value" });
    const msg = el("span", { class: "msg" });
    const save = async () => {
      if (!input.value) return;
      msg.className = "msg"; msg.textContent = "Saving…";
      try {
        await api("/api/secret", { name: s.name, value: input.value });
        input.value = "";
        await load();
      } catch (e) { msg.className = "msg bad"; msg.textContent = e.message; }
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); });
    return el("tr", {},
      el("td", {}, el("div", { class: "mono" }, s.name),
        el("div", { class: "help" }, s.used_for.join(" · ")),
        s.shared ? sharingNote(s) : null),
      el("td", {},
        (s.referenced_by || []).length
          ? el("div", {}, ...s.referenced_by.map((u) =>
              el("div", { class: "help mono" }, whereNamed(u))))
          : el("span", { class: "pill" }, "not used yet")),
      el("td", {},
        el("span", { class: "pill " + (s.set ? "set" : "missing") },
          s.set ? (s.source === "environment" ? "exported" : "set") : "missing"),
        s.source === "environment"
          ? el("p", { class: "help" }, "exported into this process, so the file is not what is in force")
          : null),
      el("td", {}, el("div", { class: "row" }, input,
        el("button", { class: "quiet", onclick: save }, "Save"),
        s.source === "file"
          ? el("button", { class: "quiet", onclick: async () => {
              try { await api("/api/secret/remove", { name: s.name }); await load(); }
              catch (e) { alert(e.message); }
            } }, "Remove")
          : null), msg),
    );
  });

  const mint = el("input", { type: "text", placeholder: "NS_SOMETHING_ACME" });
  const mintValue = el("input", { type: "password", placeholder: "the value" });
  const mintMsg = el("span", { class: "msg" });

  return el("div", {},
    el("div", { class: "banner" },
      "Values for the variables the config names. They are written to " +
      (state.secretsFile || ".env") + " beside the config, never into config.toml, and " +
      "never sent back to this page — it is told only whether each one is set. " +
      "Anything already exported into the process wins over the file."),
    el("section", {},
      el("h2", {}, "The vault"),
      el("p", { class: "note" },
        "Every variable your configuration names, and every one the file holds that " +
        "nothing names yet. A key minted here can be picked on a company's key field."),
      rows.length
        ? el("table", {}, el("thead", {}, el("tr", {},
            el("th", {}, "Variable"), el("th", {}, "Used by"),
            el("th", {}, "Status"), el("th", {}, "Value"))),
            el("tbody", {}, ...rows))
        : el("p", { class: "help" }, "Nothing is named yet."),
      el("div", { class: "row", style: "margin-top:14px" }, mint, mintValue,
        el("button", { class: "quiet", onclick: async () => {
          if (!mint.value.trim() || !mintValue.value) return;
          mintMsg.className = "msg"; mintMsg.textContent = "Saving…";
          try {
            await api("/api/secret", { name: mint.value.trim(), value: mintValue.value });
            mint.value = ""; mintValue.value = "";
            await load();
          } catch (e) { mintMsg.className = "msg bad"; mintMsg.textContent = e.message; }
        } }, "Add a key")),
      el("p", { class: "help" },
        "Adding one before the company that will use it is fine — it is listed as not " +
        "used yet until something names it."),
      mintMsg));
}

// H6. Groups can be expressed and cannot yet do anything, and the page does
// not pretend otherwise — every one of these controls carries the notice,
// because a reader who saw only the form would reasonably assume the thing
// it describes is in force.
const GROUPS_ARE_INERT =
  "Nothing enforces this yet. Groups are stored and shown so the shape can be " +
  "agreed on; the enforcement belongs to the multi-tenant plan's Phase 8, where a " +
  "group reaches a session through the token's grants claim. Until then, every " +
  "person at this company reaches every tool it has.";

function groupsSection(companyId) {
  const groups = (state.groups || {})[companyId] || {};
  const modules = libraryOf("module").map((e) => e.name);
  const name = el("input", { type: "text", placeholder: "new group, e.g. agents" });

  const save = async (groupName, chosen, remove) => {
    try {
      await api("/api/group",
        { company: companyId, name: groupName, modules: chosen, remove: !!remove });
      await load();
    } catch (e) { alert(e.message); }
  };

  const rows = Object.entries(groups).map(([groupName, chosen]) => {
    // Whatever the group already names is offered even when the library no
    // longer lists it — a module renamed or a library that failed to load
    // would otherwise turn "Save group" into a silent wipe of names the
    // operator never saw.
    const offered = modules.slice();
    for (const m of chosen) if (!offered.includes(m)) offered.push(m);
    const boxes = offered.map((m) => {
      const box = el("input", { type: "checkbox", value: m });
      box.checked = chosen.includes(m);
      return el("label", { class: "row check" }, box, el("span", {}, m),
        modules.includes(m) ? null
          : el("span", { class: "pill missing" }, "not in the library"));
    });
    return el("div", { class: "field" },
      el("label", {}, groupName),
      boxes.length ? boxes : el("span", { class: "help" }, "no modules in the library yet"),
      el("div", { class: "row", style: "margin-top:6px" },
        el("button", { class: "quiet", onclick: (e) => {
          const picked = [...e.target.closest(".field").querySelectorAll("input:checked")]
            .map((b) => b.value);
          save(groupName, picked, false);
        } }, "Save group"),
        el("button", { class: "quiet", onclick: () => save(groupName, [], true) }, "Remove")));
  });

  return el("section", {},
    el("h2", {}, "Groups ", el("span", { class: "pill missing" }, "not enforced yet")),
    el("p", { class: "note" },
      "A group is a name and a set of this company's modules — who among its people " +
      "may reach what."),
    el("p", { class: "help sharing" }, GROUPS_ARE_INERT),
    rows.length ? rows : el("p", { class: "help" }, "None yet."),
    el("div", { class: "row", style: "margin-top:14px" }, name,
      el("button", { class: "quiet", onclick: () => {
        if (!name.value.trim()) return;
        save(name.value.trim(), [], false);
      } }, "Add group")));
}

function libraryOf(kind) {
  return (state.library || []).filter((e) => e.kind === kind);
}

// One shared thing, with its readers above the editor rather than below it.
// H4: an edit here reaches every company naming it, and the page has to say
// which ones before the save, not after.
function libraryEntry(entry) {
  const area = el("textarea", { class: "tall" });
  area.value = entry.text;
  const msg = el("span", { class: "msg" });

  const save = async () => {
    if (entry.used_by.length > 1) {
      const ok = window.confirm(
        "This " + entry.kind + " is used by " + entry.used_by.join(", ") +
        ".\n\nSaving changes it for all of them. Continue?");
      if (!ok) return;
    }
    msg.className = "msg"; msg.textContent = "Saving…";
    try {
      await api("/api/library", { kind: entry.kind, name: entry.name, text: area.value });
      await load();
    } catch (e) { msg.className = "msg bad"; msg.textContent = e.message; }
  };

  return el("section", {},
    el("h2", {}, el("span", { class: "mono" }, entry.name),
      entry.kind === "module" && entry.components !== null
        ? el("span", { class: "pill" }, entry.components + " tool" +
            (entry.components === 1 ? "" : "s"))
        : null),
    entry.used_by.length
      ? el("p", { class: "note" + (entry.used_by.length > 1 ? " help sharing" : "") },
          "Used by " + entry.used_by.join(", ") +
          (entry.used_by.length > 1
            ? " — an edit here changes it for all of them."
            : "."))
      : el("p", { class: "note" }, "No company uses this yet."),
    entry.overridden_by.length
      ? el("p", { class: "help sharing" },
          entry.overridden_by.join(", ") + " name it but write their own persona, so " +
          "this text does not reach them.")
      : null,
    entry.problem ? el("p", { class: "msg bad" }, entry.problem) : null,
    area,
    el("div", { class: "row", style: "margin-top:10px" },
      el("button", { class: "do", onclick: save }, "Save"), msg));
}

function libraryTab() {
  const name = el("input", { type: "text", placeholder: "new name, e.g. support-brief" });
  const kind = el("select", {},
    el("option", { value: "persona" }, "persona"),
    el("option", { value: "module" }, "module"));

  return el("div", {},
    el("div", { class: "banner" },
      "Shared things, referenced by name and never copied: personas/ is prose, " +
      "modules/ is files of tools. A company names what it uses on its own tab, and a " +
      "name that is not here is refused at startup rather than skipped — so a company " +
      "never quietly runs without the persona it asked for."),
    ...(state.library || []).map(libraryEntry),
    el("section", {},
      el("h2", {}, "Add something"),
      el("p", { class: "note" },
        "A persona is prose. A module is the same [[http_component]] entries you would " +
        "otherwise paste into a config, and is checked before it is written."),
      el("div", { class: "row" }, kind, name,
        el("button", { class: "quiet", onclick: async () => {
          if (!name.value.trim()) return;
          const starter = kind.value === "module"
            ? "[[http_component]]\nname = \"\"\ndescription = \"\"\nurl = \"\"\n" +
              "side_effect = \"Pure\"\nargs_schema = { type = \"object\" }\n"
            : "";
          try {
            await api("/api/library",
              { kind: kind.value, name: name.value.trim(), text: starter, fresh: true });
            name.value = "";
            await load();
          } catch (e) { alert(e.message); }
        } }, "Create"))));
}

function render() {
  for (const button of document.querySelectorAll("nav button")) {
    button.setAttribute("aria-selected", String(button.dataset.tab === tab));
  }
  main.replaceChildren(
    tab === "process" ? processTab()
      : tab === "companies" ? companiesTab()
      : tab === "library" ? libraryTab()
      : vaultTab());
}

async function load() {
  state = await api("/api/state");
  // The vault is its own route because it knows about entries the form does
  // not — a key minted before anything names it.
  state.vault = (await api("/api/vault")).entries || [];
  state.library = (await api("/api/library")).entries || [];
  document.getElementById("root").textContent = state.root;
  render();
}

for (const button of document.querySelectorAll("nav button")) {
  button.addEventListener("click", () => { tab = button.dataset.tab; render(); });
}

load().catch((e) => {
  main.replaceChildren(el("section", {},
    el("h2", {}, "Cannot read the settings"),
    el("p", { class: "msg bad" }, e.message),
    el("p", { class: "help" },
      "If this says 401, open the link ns-app printed — it carries the token for this run.")));
});
</script>
</body>
</html>
