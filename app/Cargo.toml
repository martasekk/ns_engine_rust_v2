[package]
name = "ns-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ns-app"
path = "src/main.rs"

[dependencies]
ns-core = { path = "../crates/core" }
ns-engine = { path = "../crates/engine" }
ns-channel-cli = { path = "../crates/channel-cli" }
ns-llm = { path = "../crates/llm" }
ns-components-std = { path = "../crates/components-std" }
ns-memory-sqlite = { path = "../crates/memory-sqlite" }
ns-evolution = { path = "../crates/evolution" }
ns-testkit = { path = "../crates/testkit" }
ns-pointer = { path = "../crates/pointer" }
arc-swap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
# Runtime, not just tests: `ns-app eval --paraphrase` measures the sqlite
# retriever in a throwaway database rather than the live one.
tempfile = { workspace = true }

[dev-dependencies]
