# Copy to config.toml and adjust. The API key comes from the environment
# variable named by [llm] api_key_env (default OPENROUTER_API_KEY), never
# from this file.
#
# Any provider that speaks POST {base_url}/v1/chat/completions with
# OpenAI-style function tools works. Presets (uncomment one block):
#
#   Mistral (free Experiment tier, ~1 req/s, 500K TPM). Requests are spaced
#   1100 ms apart automatically for api.mistral.ai; set min_interval_ms to
#   override (0 = no spacing).
#     [llm]
#     base_url = "https://api.mistral.ai"
#     api_key_env = "MISTRAL_API_KEY"
#     min_interval_ms = 1100
#     [llm.emitter]
#     model = "mistral-small-latest"
#     [llm.replier]
#     model = "mistral-small-latest"
#
#   Ollama (local, unlimited; the key can be any non-empty string).
#   Pick a non-thinking model: Ollama's OpenAI endpoint ignores `think`,
#   so qwen3 burns the whole output budget on reasoning (minutes on CPU).
#     [llm]
#     base_url = "http://localhost:11434"
#     api_key_env = "OLLAMA_API_KEY"
#     [llm.emitter]
#     model = "qwen2.5:3b"
#     [llm.replier]
#     model = "qwen2.5:3b"

[llm.emitter]
model = "openrouter/free"

[llm.replier]
model = "openrouter/free"

[engine]
max_iterations = 5
max_emit_retries = 3

[persona]
text = "You are a helpful, concise assistant."

[store]
path = "ns.sqlite"

# Evolution pass (self-improvement, spec 2026-09-02). Both drivers:
#   batch:  ns-app evolve [--dry-run]      (cron-friendly; audit via git diff learned.toml)
#   idle:   after idle_after_secs of silence while running (0 = off)
[evolution]
enabled = true
learned_path = "learned.toml"
ledger_path = "evolution-ledger.json"
idle_after_secs = 300
regression_budget = 0        # notes gate: negatives allowed to regress
probe_budget_turns = 40      # live probe turns per pass (notes lane)
max_notes = 20
regression_replay_cap = 200  # newest sessions replayed by the symbolic gate

# Working memory (M6 spec §4). Both models see the last window_turns turns
# verbatim (user text, actions with outcomes, reply), capped per record.
[memory]
window_turns = 6
record_max_chars = 300
line_max_chars = 120
facts_in_context = 10         # pinned core + facts relevant to the current message
pinned_prefixes = ["user."]   # always shown, newest first, with the value they replaced
pinned_max = 5
relevant_max = 5
fact_stale_days = 90          # unused this long -> cold (kept, searchable, not pinned)
reply_grounding_check = true  # regenerate once a reply that invents numbers/names
remember_residual = "flag"    # "never": refuse remembered values the user never said
# Rolling summary of the turns outside the window (M6 §5.1), written after
# the reply is sent. Rebuilt from verbatim records every Nth time.
summary_every_turns = 4       # 0 = off
summary_rebuild_every = 3
summary_max_chars = 800
summary_input_max_chars = 6000
recall_top_k = 5              # hits per source for the recall action (FTS5 over the log)

# The summary model defaults to the emitter's model and provider; override
# any field to swap the role, e.g. a local Ollama model:
# [llm.summarizer]
# model = "qwen2.5:3b"
# base_url = "http://localhost:11434"
# api_key_env = "OLLAMA_API_KEY"

