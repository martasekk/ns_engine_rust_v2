# Copy to config.toml and adjust. API keys never live in this file: a
# provider names the environment variable that holds its key.
#
# ── Swapping the agent ────────────────────────────────────────────────────
# Full guide: docs/providers.md — setup per provider, picking a model,
# troubleshooting. `ns-app providers` lists every preset, shows which keys
# are set, and prints what this config currently resolves to.
#
#   whole config   [llm] provider = "ollama"
#   one run        NS_PROVIDER=ollama [NS_MODEL=qwen2.5:3b] ns-app
#   one role       [llm.replier] model = "mistral:mistral-small-latest"
#
# A preset supplies base_url, api_key_env, a default model, the provider's
# request spacing and whether Anthropic cache breakpoints survive the hop.
# Any of those can be overridden field by field below. Presets ship for:
# openrouter, mistral, ollama, lmstudio, llamacpp, openai, groq — anything
# else works too, by spelling out base_url (the protocol is POST
# {base_url}/v1/chat/completions with OpenAI-style function tools).
#
# In a `provider:model` string only a known provider name counts as a
# prefix, so model ids that contain a colon (`qwen2.5:3b`) stay intact.
[llm]
provider = "openrouter"

# Local, no key needed — pick a non-thinking model: Ollama's OpenAI
# endpoint ignores `think`, so qwen3 spends its whole output budget on
# reasoning (minutes on CPU).
#   provider = "ollama"

# Free Experiment tier, ~1 req/s; requests are spaced 1100 ms apart
# automatically. min_interval_ms = 0 turns the spacing off.
#   provider = "mistral"

# Per-role overrides. Unset fields fall back to [llm]; the summarizer falls
# back to the emitter. Each role may sit on a different provider.
# [llm.emitter]
# model = "openrouter/free"
# [llm.replier]
# model = "openrouter/free"

# ── Per-role request shape ────────────────────────────────────────────────
# Four optional fields per role; every one unset (the default) sends the
# request this engine has always sent.
#
#   reasoning   "low" | "medium" | "high" — OpenRouter's reasoning effort.
#   max_tokens  output cap. Unset: emitter and replier 4096, summarizer 400.
#   sampling    "default" (temperature 0 where the role had one) or "none"
#               (no sampling param at all — not a different value, no key).
#   thinking    false sends reasoning {"enabled": false}, for models that
#               reason by default where a tool call is wanted instead.
#
# Claude Sonnet 5 rejects temperature/top_p/top_k and manual thinking budgets
# with a 400, so any `anthropic/claude-sonnet-5*` id defaults sampling to
# "none" on its own and says so at startup. These are the recommended shapes
# for it — the emitter's job is one tool call, the replier's is the prose:
#
#   [llm.emitter]
#   model = "anthropic/claude-sonnet-5"
#   reasoning = "low"
#   max_tokens = 2048
#
#   [llm.replier]
#   model = "anthropic/claude-sonnet-5"
#   reasoning = "medium"
#   max_tokens = 4096
#
#   [llm.summarizer]
#   model = "anthropic/claude-sonnet-5"
#   reasoning = "low"
#   max_tokens = 1024
#
# A local Qwen3 thinks by default and will spend the whole output budget on
# it before the tool call; the emitter switches that off and keeps its
# pinned temperature:
#
#   [llm.emitter]
#   model = "ollama:qwen3:8b"
#   thinking = false

[engine]
max_iterations = 5
max_emit_retries = 3

[persona]
text = "You are a helpful, concise assistant."

[store]
path = "ns.sqlite"

# Evolution pass (self-improvement, spec 2026-09-02). Both drivers:
#   batch:  ns-app evolve [--dry-run]      (cron-friendly; audit via git diff learned.toml)
#   idle:   after idle_after_secs of silence while running (0 = off)
[evolution]
enabled = true
learned_path = "learned.toml"
ledger_path = "evolution-ledger.json"
idle_after_secs = 300
regression_budget = 0        # notes gate: negatives allowed to regress
probe_budget_turns = 40      # live probe turns per pass (notes lane)
max_notes = 20
regression_replay_cap = 200  # newest sessions replayed by the symbolic gate

# Working memory (M6 spec §4). Both models see the last window_turns turns
# verbatim (user text, actions with outcomes, reply), capped per record.
[memory]
window_turns = 6
record_max_chars = 300
line_max_chars = 120
facts_in_context = 10         # pinned core + facts relevant to the current message
pinned_prefixes = ["user."]   # always shown, newest first, with the value they replaced
pinned_max = 5
relevant_max = 5
fact_stale_days = 90          # unused this long -> cold (kept, searchable, not pinned)
# How many of a turn's own tool outcomes stay verbatim in the prompt (M7
# T1.3). Older ones fold into one counted line — "earlier this turn (7
# steps): pointer_move ok x3 ..." — and refusals never fold, since they are
# what steer the next proposal. 0 turns the fold off. A result too big to
# show is clipped with a handle (r42) that `inspect_result` reads the rest
# from, so folding loses nothing that cannot be fetched back.
trace_verbatim_lines = 5
# A ceiling for the whole composed context — facts, summary, window, the
# current turn — in estimated tokens at four characters each (M7 T2.1). Not
# the model's limit: a working ceiling for the blocks the engine controls.
# The system prompt is fixed and the tool schemas are measured separately
# and exactly (`ns-app budget` reports them), so neither is counted here.
# 0 turns the budget off.
prompt_budget_tokens = 6000
# "report" measures what it would drop and drops nothing; "enforce" applies
# it. Report is the default on purpose: a context manager that drops is a
# theory about which context does not matter, and `ns-app budget` is how the
# theory gets tested first. Turn it on when the drops recorded here are
# shown not to be followed by fallbacks, re-asks or corrections.
budget_mode = "report"
# Show the emitter one line naming its own size against the ceiling, and the
# clipped results it could inspect. An experiment: VISTA reports a large gain
# from it on a Flash-class model, and whether a 3B emitter acts on it here is
# what the task set is for.
show_budget_line = false

# What kind of turn this is, decided before any model call (M7 phase 3).
#
#   chat  the synthetic actions only, pinned facts, half the budget. With a
#         desktop wired in this takes ten of seventeen tool schemas off a
#         turn that was never going to click anything.
#   task  everything legal, the whole context.
#   deep  everything task has, and the engine runs `recall` itself before
#         the first proposal instead of spending an emitter iteration being
#         asked for it -- on a fifty-request day that iteration is a request
#         that bought no progress.
#
# Symbolic, not a model: a judge here would cost a request and make routing
# non-deterministic, and a replayed session has to route the way it did the
# first time. A wrong guess is cheap -- proposing a tool the tier hid widens
# the tier and re-asks, and never records a refusal.
#
# Empty lists keep the built-in cues (English and Czech, since this runs on
# a Czech desktop and "co jsem" is how the question is actually asked).
[router]
enabled = true
# recall_cues = ["before", "earlier", "last time", "co jsem", "minule"]
# task_cues = ["click", "type", "open", "klikni", "otevři"]
reply_grounding_check = true  # regenerate once a reply that invents numbers/names
max_echo_ratio = 0.6          # log (do not rewrite) a reply this much of which is lifted from its own prompt
remember_residual = "flag"    # "never": refuse remembered values the user never said
# Rolling summary of the turns outside the window (M6 §5.1), written after
# the reply is sent. Rebuilt from verbatim records every Nth time.
summary_every_turns = 4       # 0 = off
summary_rebuild_every = 3
summary_max_chars = 800
summary_input_max_chars = 6000
recall_top_k = 5              # hits per source for the recall action (FTS5 over the log)
# How many earlier conversations of this scope `recall` also searches (M7
# phase 4). Only sessions the consolidator has digested count as earlier
# ones, and a digest is the session's last rolling summary copied — so
# cross-session memory costs no extra model call. Verbatim lines from an
# earlier session rank above the digest of it; the digest is there to say
# what a whole conversation was about, which no single line does. 0 keeps
# recall inside the current conversation.
recall_sessions = 3

# The summary model defaults to the emitter's model and provider. One line
# moves just this role onto a local model:
# [llm.summarizer]
# model = "ollama:qwen2.5:3b"

# External HTTP endpoints exposed as tools (Windmill/n8n escape hatch).
# [[http_component]]
# name = "check_stock"
# description = "Check stock level for a product"
# url = "https://example.com/api/stock"
# side_effect = "Pure"
# args_schema = { type = "object", properties = { product = { type = "string" } }, required = ["product"] }

# A desktop to drive: the ns-pointer agent (ns-pointerd) on that machine.
# Registers pointer_screens, pointer_click, pointer_type, pointer_ui_read and
# the rest as harness actions; clicks and typing are staged behind the same
# confirmation flow as every other irreversible action. The token comes from
# the named env var, never from this file. NS_POINTER_ADDR overrides addr.
# [pointer]
# addr = "192.168.1.40:7373"      # the agent must be started with allow_remote for a non-loopback bind
# token_env = "NS_POINTER_TOKEN"  # default
