# Copy to config.toml and adjust. The API key comes from the
# OPENROUTER_API_KEY environment variable, never from this file.

[llm.emitter]
model = "anthropic/claude-haiku-4.5"

[llm.replier]
model = "anthropic/claude-sonnet-5"

[engine]
max_iterations = 5
max_emit_retries = 3

[persona]
text = "You are a helpful, concise assistant."

[store]
path = "ns.sqlite"

